<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Peeks — Spot the Difference</title>
<style>
  :root {
    --ink: #2d3436;
    --muted: #636e72;
    --green: #2ecc71;
    --red: #e74c3c;
    --gold: #f7b731;
    --card: #ffffff;
    --bg: #dfe6e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 1120px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px 6px;
    flex-wrap: wrap;
  }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: #e17055; }
  .hud {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--card);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    white-space: nowrap;
  }
  .pill b { color: #0984e3; }
  .pill.time b { color: #d63031; }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    background: #0984e3;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: #fff; color: var(--ink); }
  .timewrap { width: 100%; max-width: 1120px; padding: 0 18px; }
  .timebar {
    height: 8px;
    background: #b2bec3;
    border-radius: 99px;
    overflow: hidden;
    margin: 4px 0 2px;
  }
  .timebar div {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    transition: width .1s linear;
  }
  .timebar div.low { background: var(--red); }
  main {
    width: 100%;
    max-width: 1120px;
    padding: 8px 18px;
    display: flex;
    gap: 14px;
    justify-content: center;
    position: relative;
  }
  .panel {
    background: var(--card);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
    position: relative;
  }
  .panel .tag {
    position: absolute;
    top: -11px;
    left: 14px;
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 99px;
    letter-spacing: .4px;
  }
  canvas {
    display: block;
    width: 520px;
    max-width: calc(50vw - 34px);
    height: auto;
    border-radius: 8px;
    cursor: crosshair;
  }
  footer {
    width: 100%;
    max-width: 1120px;
    padding: 4px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  #msg { font-size: 15px; font-weight: 600; min-height: 22px; }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #b2bec3;
  }
  .dot.done { background: var(--green); }
  .dot.now { background: var(--gold); box-shadow: 0 0 0 3px rgba(247,183,49,.35); }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay .card {
    background: #fff;
    border-radius: 18px;
    padding: 30px 36px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  #overlay h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: -1px; }
  #overlay h2 { margin: 0 0 8px; font-size: 28px; }
  #overlay .tag { color: var(--muted); font-weight: 600; margin: 0 0 14px; }
  #overlay p { line-height: 1.55; }
  #overlay .big { font-size: 20px; }
  #overlay .muted { color: var(--muted); }
  #overlay .small { font-size: 13px; }
  #overlay button { margin-top: 10px; font-size: 17px; padding: 12px 26px; }
</style>
</head>
<body>
  <header>
    <div class="logo">👀 Twin <span>Peeks</span></div>
    <div class="hud">
      <div class="pill" id="levelName">Level 1 · Sunny Park</div>
      <div class="pill">Found <b id="foundCount">0 / 5</b></div>
      <div class="pill time">⏱ <b id="timeLeft">90s</b></div>
      <div class="pill">Score <b id="score">0</b></div>
      <button id="hintBtn">💡 Hint (<span id="hintsLeft">3</span>)</button>
      <button id="muteBtn" class="ghost">🔊 Sound</button>
    </div>
  </header>
  <div class="timewrap"><div class="timebar"><div id="timeBar" style="width:100%"></div></div></div>
  <main>
    <div class="panel"><span class="tag">ORIGINAL</span><canvas id="left" width="520" height="360"></canvas></div>
    <div class="panel"><span class="tag">TWIN</span><canvas id="right" width="520" height="360"></canvas></div>
  </main>
  <footer>
    <div id="msg">Click a difference on either picture to mark it.</div>
    <div class="dots"><span class="dot now"></span><span class="dot"></span><span class="dot"></span></div>
  </footer>
  <div id="overlay" class="hidden"></div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
